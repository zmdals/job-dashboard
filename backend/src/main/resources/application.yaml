server:
  shutdown: graceful
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 3        # 팀원 수에 맞춰 줄이기 (기본값 10은 너무 큼)
      minimum-idle: 1
      idle-timeout: 30000         # 30초 뒤 idle 연결 반환
      max-lifetime: 600000        # 10분마다 연결 갱신
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: public
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect